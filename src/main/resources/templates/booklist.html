<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<link type="text/css" rel="stylesheet" href="css/bootstrap.min.css" th:href="@{css/bootstrap.min.css}" />
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <div class="col-md-4" style="padding:20px 0">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Sign out" class="btn btn-sm btn-secondary">
        </form>
    </div>
    <h3 class="text-secondary">Welcome <span sec:authentication="name"></span>!</h3>
    <h1>Books</h1>
   
    <table class="table table-striped">
        <tr>
            <th>Nimi</th>
            <th>Kirjailija</th>
            <th>Julkaisuvuosi</th>
            <th>Isbn</th>
            <th>Hinta</th>
            <th>Kategoria</th>
            <th sec:authorize="hasAuthority('ADMIN')"></th>
        </tr>      
        <tr th:each="book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.category.categoryName}"></td>
            <td sec:authorize="hasAuthority('ADMIN')"><a th:href="@{/delete/{id}(id=${book.id})}" class="btn btn-danger">Delete</a></td>
            <td sec:authorize="hasAuthority('ADMIN')"><a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-warning">Edit</a></td>
        </tr>
    </table>
    <a href="add" class="btn btn-success">Add book</a>
</body>
</html>
