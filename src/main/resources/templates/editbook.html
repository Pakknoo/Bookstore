<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>Edit book</h1>
    <div>
        <form th:action="@{../save}" th:object="${book}" method="post">
            <input type="hidden" id="id" th:field="*{id}">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}">
            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}">
            <label for="pubYear">Publication year</label>
            <input type="text" id="pubYear" th:field="*{publicationYear}">
            <label for="isbn">Isbn</label>
            <input type="text" id="isbn" th:field="*{isbn}">
            <label for="price">Price</label>
            <input type="text" id="price" th:field="*{price}">
            <label for="ca">Category</label>
            <select id="ca" th:field="*{category}" class="form-control">
                <option th:each="category : ${categories}" th:value="${category.categoryId}"
                    th:text="${category.categoryName}">
                </option>
            </select>
            <input type="submit" value="Save">
        </form>
    </div>
</body>

</html>
